{# La cabecera compartida de los pasos: volver, contador y barra de progreso. #}
<header class="cabecera">
  <a class="volver" href="{{ atras }}">‹ {% if paso == 1 %}Cancelar{% else %}Atrás{% endif %}</a>
  <p class="mono">PASO {{ paso }}/{{ total }}</p>
</header>
<div class="progreso"><div style="width: {{ (paso / total * 100)|round }}%"></div></div>
